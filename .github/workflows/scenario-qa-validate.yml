name: Validate Scenario legacy QA batch 1 (rerun)

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/scenario-qa-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Run tests
        run: python -m pytest -q korean/tests
      - name: Merge Scenario translations
        run: >-
          python korean/tools/merge_scenario_translations.py
          --items korean/translation/scenario_items_ko.csv
          --actors korean/translation/scenario_monsters_ko.csv
          --output scratch/scenario_all_ko.csv
      - name: Audit unified codebook
        run: >-
          python korean/tools/build_translation_codebook.py
          korean/translation/messages_ko.csv
          korean/translation/scenario_items_ko.csv
          korean/translation/scenario_monsters_ko.csv
          --codebook scratch/codebook.json
          --report scratch/codebook_report.json
      - name: Enforce runtime glyph limit and print summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('scratch/codebook_report.json').read_text(encoding='utf-8'))
          summary = {k: report[k] for k in (
              'source_row_count','translated_row_count','custom_glyph_count',
              'runtime_glyph_limit','runtime_glyph_headroom','glyph_limit_exceeded',
              'encoding_failure_count'
          )}
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if report['glyph_limit_exceeded'] or report['encoding_failure_count']:
              raise SystemExit('Scenario QA batch violates codebook/runtime constraints')
          PY
