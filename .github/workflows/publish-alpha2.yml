name: Finalize Wizardry VI Korean alpha.2

on:
  push:
    branches:
      - korean-localization
    paths:
      - ".github/workflows/publish-alpha2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.2
      ASSET: Wizardry6-Korean-v0.1.0-alpha.2.zip
      EXPECTED_SHA256: 5451bf480a095262e512cf1a198d7e3564dda96ad3fcbb0e911f6b5baca5e3f8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify published alpha.2 asset digest
        run: |
          actual="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == env.ASSET) | .digest')"
          test "$actual" = "sha256:$EXPECTED_SHA256"

      - name: Refresh release notes
        run: gh release edit "$TAG" --notes-file docs/RELEASE_NOTES_v0.1.0-alpha.2.md --prerelease

      - name: Remove Test8 staging asset from alpha.1
        run: |
          gh release delete-asset v0.1.0-alpha.1 Wizardry6_Korean_Runtime_Recovery_Test8_WPCMK_Compact2Glyph.zip -y || true
