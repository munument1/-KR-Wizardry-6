name: Apply full legacy Scenario translations

on:
  push:
    branches: [korean-localization]
    paths: [".github/workflows/scenario-legacy-full-import.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: korean-localization

      - name: Replace all matched Scenario rows
        run: |
          python - <<'PY'
          import base64, csv, json, zlib
          from collections import Counter
          from pathlib import Path

          payload = ""
          legacy_rows = json.loads(zlib.decompress(base64.b64decode(payload)).decode("utf-8"))
          legacy = {(cat, int(idx), variant): text for cat, idx, variant, text in legacy_rows}
          if len(legacy) != 277:
              raise SystemExit(f"unexpected legacy row count: {len(legacy)}")

          def encoded_len(text):
              return sum(1 if ord(ch) < 0x80 else 2 for ch in text)

          for key, text in legacy.items():
              if not text or encoded_len(text) > 15:
                  raise SystemExit(f"invalid legacy field: {key} {text!r} len={encoded_len(text)}")

          fields = ["category", "record_index", "variant", "translation"]

          item_path = Path("korean/translation/scenario_items_ko.csv")
          with item_path.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          item_keys = {k for k in legacy if k[0] == "item"}
          seen = set()
          for row in rows:
              key = (row["category"], int(row["record_index"]), row["variant"])
              if key in item_keys:
                  seen.add(key)
                  row["translation"] = legacy[key]
          if seen != item_keys:
              raise SystemExit(f"missing item keys: {sorted(item_keys-seen)[:10]}")
          with item_path.open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              w.writeheader(); w.writerows(rows)

          actor_path = Path("korean/translation/scenario_monsters_ko.csv")
          with actor_path.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          # Remove the earlier selective-QA explicit variants. Re-add only the
          # variants that actually exist in the legacy Scenario reference.
          rows = [r for r in rows if not (r["category"] == "monster" and r["variant"] != "name")]
          base_keys = {k for k in legacy if (k[0] == "monster" and k[2] == "name") or k[0] == "npc"}
          seen = set()
          for row in rows:
              key = (row["category"], int(row["record_index"]), row["variant"])
              if key in base_keys:
                  seen.add(key)
                  row["translation"] = legacy[key]
          if seen != base_keys:
              raise SystemExit(f"missing actor keys: {sorted(base_keys-seen)[:10]}")

          explicit = []
          for cat, idx, variant in sorted(legacy):
              if cat == "monster" and variant != "name":
                  explicit.append({
                      "category": cat,
                      "record_index": str(idx),
                      "variant": variant,
                      "translation": legacy[(cat, idx, variant)],
                  })
          first_npc = next((i for i, r in enumerate(rows) if r["category"] == "npc"), len(rows))
          rows[first_npc:first_npc] = explicit

          counts = Counter((r["category"], r["variant"]) for r in rows)
          expected = {
              ("monster", "name"): 186,
              ("monster", "name_plural"): 11,
              ("monster", "short_name"): 19,
              ("monster", "short_name_plural"): 15,
              ("npc", "name"): 30,
          }
          if dict(counts) != expected:
              raise SystemExit(f"unexpected actor counts: {dict(counts)}")

          with actor_path.open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              w.writeheader(); w.writerows(rows)

          print("legacy rows:", len(legacy))
          print("items:", len(item_keys))
          print("explicit monster variants:", len(explicit))
          print("actor counts:", dict(counts))
          PY

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korean/translation/scenario_items_ko.csv korean/translation/scenario_monsters_ko.csv
          git diff --cached --check
          git commit -m "translation: replace matched Scenario rows with legacy translations"
          git push origin HEAD:korean-localization
